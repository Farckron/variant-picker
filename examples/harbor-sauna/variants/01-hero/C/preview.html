<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temperature dial</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../../shared/base.css">
<style>main{min-height:100svh;display:grid;align-content:center;gap:26px;text-align:center;background:var(--bg,#e0956b);transition:background .15s;padding:32px}b{font:600 clamp(120px,26vw,330px)/.9 Georgia,"Noto Serif",serif}input{width:min(720px,88vw);margin:auto;accent-color:var(--spruce);height:44px}h1{font-size:clamp(28px,4vw,52px)}.s{display:flex;justify-content:space-between;width:min(720px,88vw);margin:auto}</style>
<main><h1>How warm do you want to be?</h1><b id="n">58°</b><input id="r" type="range" min="9" max="84" value="58" aria-label="Temperature in Celsius"><div class="s"><span>9° the sea</span><span>84° the sauna</span></div><div><a class="btn" style="background:var(--spruce)" href="#">Try both, EUR 14</a></div></main>
<script>(()=>{const r=document.querySelector("#r"),n=document.querySelector("#n"),f=()=>{const k=(r.value-9)/75;n.textContent=r.value+"°";document.querySelector("main").style.setProperty("--bg",`color-mix(in oklab, #ee8258 ${100*k}%, #a9d3d8)`)};r.addEventListener("input",f);f()})()</script>
</html>
