<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor clock</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../../shared/base.css">
<style>main.wrap{align-items:center;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;align-items:center}h2{font-size:clamp(36px,5vw,64px)}svg{width:100%;max-width:520px;margin:auto}p{margin-top:18px}</style>
<main class="wrap"><div><h2>Six times around the clock</h2><p>Each session is 75 minutes.<br>Every arc is one you can book.</p><p><a class="btn" href="#">Book the 18:30</a></p></div><svg viewBox="-120 -120 240 240" role="img" aria-label="24 hour dial with sessions at 07:00, 09:30, 12:00, 15:30, 18:30 and 20:45"><circle r="88" fill="none" stroke="#c9d0c8" stroke-width="26"/><g id="a" fill="none" stroke="#e4572e" stroke-width="26"></g><g id="t" font-family="monospace" font-size="10" text-anchor="middle" fill="#12312b"></g><text y="8" font-size="26" text-anchor="middle" font-family="Georgia,serif" fill="#12312b">18:30</text></svg></main>
<script>(()=>{const P=(h,r)=>{const a=h/24*2*Math.PI-Math.PI/2;return[r*Math.cos(a),r*Math.sin(a)]};for(const h of[7,9.5,12,15.5,18.5,20.75]){const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",`M${P(h,88)}A88 88 0 0 1 ${P(h+1.25,88)}`);document.querySelector("#a").append(p)}for(const h of[0,6,12,18]){const t=document.createElementNS("http://www.w3.org/2000/svg","text"),[x,y]=P(h,60);t.setAttribute("x",x);t.setAttribute("y",y+4);t.textContent=String(h).padStart(2,"0");document.querySelector("#t").append(t)}})()</script>
</html>
